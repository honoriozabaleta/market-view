name: Validate foundation
on:
  pull_request:
  push:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, full history for immutable archive comparison
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate, typecheck, lint, unit tests and audited published build
        run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser stories at all three widths and static base paths
        run: npm run test:browser
