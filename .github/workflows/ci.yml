name: Check
on:
  pull_request:
  push:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate data, typecheck, lint, unit tests and production build
        run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Browser stories at 390, 820 and 1440 px
        run: npm run test:browser
